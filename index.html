<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Haus of Memories — A Photographic Archive</title>
<meta name="description" content="Haus of Memories is a photographic archive preserving graffiti, trains, walls, and other visual moments that would otherwise disappear." />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500&family=Libre+Caslon+Text:ital@0;1&display=swap">
<script src="archive-data.js"></script>
<style>
  :root {
    --bg-1: #0b0f15;
    --bg-2: #101722;
    --steel: #93a8b8;
    --steel-dim: rgba(147,168,184,0.5);
    --line: rgba(214,72,58,0.28);
    --line-bright: rgba(214,72,58,0.55);
    --red: #d6473a;
    --glow: rgba(214,71,58,0.55);
    /* Layered glow, same technique as HPNTK's --acid-glow: a tight
       bright core, a mid halo, a wide soft diffusion — recolored
       to this project's red instead of HPNTK's acid blue. */
    --glow-text: 0 0 6px rgba(214,71,58,0.85), 0 0 14px rgba(214,71,58,0.55), 0 0 26px rgba(214,71,58,0.3);
    --glow-text-soft: 0 0 4px rgba(214,71,58,0.4), 0 0 12px rgba(214,71,58,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg-1);
    /* HUD grid — a real ruled grid instead of a faint dot texture,
       turned up enough to actually read as a grid. */
    background-image:
      radial-gradient(ellipse 80% 60% at 15% 0%, rgba(0,0,0,0.55) 0%, transparent 62%),
      radial-gradient(ellipse 70% 50% at 100% 100%, rgba(0,0,0,0.5) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(147,168,184,0.09) 0, rgba(147,168,184,0.09) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(147,168,184,0.09) 0, rgba(147,168,184,0.09) 1px, transparent 1px, transparent 42px);
    background-size: auto, auto, 42px 42px, 42px 42px;
    color: var(--steel);
    font-family: 'Libre Caslon Text', Georgia, serif;
    min-height: 100vh;
    /* Brand mark and the grid stack in real document flow now (see
       .brandmark-wrap below) instead of the mark floating on top as
       a `position: fixed` overlay — this flex column is what keeps
       both pieces centered as a unit, so the mark can never render
       on top of the cards again: it physically occupies its own
       space above them. */
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Landing: the mark sits dead centre of the page, since it is
       the only thing in flow there. Once a gallery is open the body
       gets .viewing and the mark moves to the top so the pictures
       get the rest of the height. */
    justify-content: center;
  }
  body.viewing { justify-content: flex-start; }


  /* ── Brand mark — the one piece of pure white on the page, so it
     reads as the brightest thing on screen against the red glow and
     cool grays everywhere else. Sits mostly still, then flickers
     like a bulb with a loose connection — brightness dips driven
     from JS since a real flicker is irregular, never the same shape
     twice, not a single repeating keyframe.

     This sits in normal document flow, directly above `.comb`, as
     a plain block in body's centered flex column — not a
     `position: fixed` overlay guessed into place with a calc(vh)
     offset. A fixed overlay can only ever be *near* the grid; it
     has no idea how tall the grid actually rendered, so it can end
     up sitting on top of it (which is exactly what happened). In
     flow, that's structurally impossible: the margin below is real
     space the next element is pushed out of, on every screen size,
     with no math to keep re-tuning. ── */
  .brandmark-wrap {
    position: relative;
    z-index: 2;
    /* No padding on the landing view — any padding or margin here is
       part of the flex item's outer box, so it would push the actual
       letters off true centre. The breathing room is only wanted in
       the gallery view, where the mark is top-anchored instead. */
    padding-top: 0;
    margin-bottom: 0;
    /* pointer-events: none matters more than it looks — fireflies
       drifting behind the hero text stay clickable through it. */
    pointer-events: none;
    user-select: none;
  }
  /* Once an archive is open the mark gets out of the way: off to the
     top right at a smaller size, so the photograph is the thing on
     screen. align-self overrides body's align-items: center for this
     one item only. */
  body.viewing .brandmark-wrap {
    align-self: flex-end;
    padding-top: clamp(20px, 3vh, 36px);
    padding-right: clamp(48px, 7vw, 120px);
    margin-bottom: clamp(14px, 2.4vh, 30px);
  }
  body.viewing .brandmark {
    font-size: 15px;
    letter-spacing: 0.3em;
    margin-right: -0.3em;
    text-shadow: 0 0 2px rgba(255,255,255,0.85), 0 0 8px rgba(255,255,255,0.4), 0 0 20px rgba(255,255,255,0.2);
  }

  .brandmark {
    display: inline-block;
    /* Cleaner sans at a smaller size — Inter at a light weight with
       open letter-spacing, instead of the heavy Archivo Black
       display face. */
    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    /* One fixed size, not a vw-scaled clamp. A clamp re-computes on
       every window width, so the mark visibly changed size as the
       window was resized (measured: 23px at a 1000px window, 27.6px
       at 1200px, 28px above ~1218px). It holds one size now and
       steps down once, at phone width, via the media query below. */
    font-size: 28px;
    letter-spacing: 0.34em;
    /* letter-spacing adds its gap after the LAST letter too, so that
       trailing space counts in the box width and the visible letters
       end up sitting half a gap left of centre (measured: 5px off at
       this size). Pulling the trailing gap back off the box makes it
       hug the actual ink, so centring the box centres the letters. */
    margin-right: -0.34em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.55), 0 0 26px rgba(255,255,255,0.3);
    opacity: 1;
  }

  /* ── Fireflies — now the actual navigation, replacing the card
     grid. `position: fixed` + `inset: 0` + `overflow: hidden` on
     the field keeps this layer locked to the viewport: it can
     never add to the page's height or cause scrolling, no matter
     how far a given orb's drift path wanders (it just gets
     clipped). Negative z-index keeps it behind the brand mark and
     any open gallery without needing z-index set everywhere else.

     Each `.firefly` is a real hit area (26px, generous — the glow
     itself is tiny) that drifts; the visible glow is a separate
     inner `.firefly-dot` that blinks independently, so the click
     target doesn't shrink to a few dim pixels. Hovering or
     focusing one pauses its drift, forces it fully bright, and
     reveals its archive number as a label — that's the one thing
     replacing what used to be printed on the card. ── */
  .fireflies {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    /* NOT z-index: -1. A negative z-index puts this whole layer
       behind the body box, and hit-testing follows paint order —
       so every click and hover landed on BODY instead of a
       firefly, making them un-clickable. Sitting at 0 with the
       brand mark and gallery lifted to 2 keeps them visually
       behind everything while still reachable by the pointer. */
    z-index: 0;
  }
  /* Everything lives on this layer rather than on .fireflies itself,
     so the arrow keys can move the whole swarm without dragging the
     clipping box with it. Each orb keeps its own drift on top of
     wherever the layer has been steered to. */
  .firefly-layer {
    position: absolute;
    inset: 0;
  }

  .firefly {
    position: absolute;
    left: var(--x, 50%);
    top: var(--y, 50%);
    /* `translate` is a separate property from `transform`, so a gust
       can shove the orb around while its drift keyframes keep
       animating `transform` underneath. Per-orb timing comes from JS
       so no two get caught by one gust the same way. */
    translate: 0px 0px;
    rotate: 0deg;
    will-change: translate, rotate;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    animation: firefly-drift var(--dur, 20s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .firefly:hover,
  .firefly:focus-visible {
    animation-play-state: paused;
    outline: none;
  }
  .firefly-dot {
    width: var(--size, 4px);
    height: var(--size, 4px);
    border-radius: 50%;
    background: #f4d998;
    box-shadow: 0 0 4px 1px rgba(244,217,152,0.9), 0 0 12px 4px rgba(244,217,152,0.35);
    opacity: 0;
    animation: firefly-blink var(--blink-dur, 4.5s) ease-in-out infinite;
    animation-delay: var(--blink-delay, 0s);
    transition: opacity 150ms ease, transform 150ms ease, box-shadow 150ms ease, translate 600ms ease;
  }
  .firefly:hover .firefly-dot,
  .firefly:focus-visible .firefly-dot {
    opacity: 1 !important;
    transform: scale(1.8);
    box-shadow: 0 0 6px 2px rgba(244,217,152,0.95), 0 0 18px 8px rgba(244,217,152,0.5);
  }
  /* An archive with nothing in it yet burns red instead of warm
     amber — readable at a glance across the whole field, without
     any label. It goes amber on its own the moment photographs
     exist in that archive. */
  .firefly-empty .firefly-dot {
    background: var(--red);
    box-shadow: 0 0 4px 1px rgba(214,71,58,0.9), 0 0 12px 4px rgba(214,71,58,0.4);
  }
  .firefly-empty { cursor: default; }
  .firefly-empty:hover .firefly-dot,
  .firefly-empty:focus-visible .firefly-dot {
    box-shadow: 0 0 6px 2px rgba(214,71,58,0.95), 0 0 18px 8px rgba(214,71,58,0.55);
  }

  /* Clicking an empty one pops it — a quick bright flare, then out,
     like a bulb giving up. It leaves the field for good (until a
     reload); there's nothing behind it to open. */
  @keyframes firefly-pop {
    0%   { transform: scale(1);   opacity: 1; }
    28%  { transform: scale(3.2); opacity: 1; }
    55%  { transform: scale(2.1); opacity: 0.85; }
    100% { transform: scale(0.1); opacity: 0; }
  }
  .firefly-popping { pointer-events: none; }
  .firefly-popping .firefly-dot {
    animation: firefly-pop 400ms cubic-bezier(0.2, 0.75, 0.3, 1) forwards !important;
    background: #ffd9cf;
    box-shadow: 0 0 8px 3px rgba(255,180,160,0.95), 0 0 26px 12px rgba(214,71,58,0.6);
  }
  .firefly-popping .firefly-label { opacity: 0 !important; }
  @media (prefers-reduced-motion: reduce) {
    .firefly-popping .firefly-dot { animation: none !important; opacity: 0 !important; }
  }

  .firefly-label {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%) translateY(-4px);
    white-space: nowrap;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--steel);
    text-shadow: 0 0 8px rgba(11,15,21,0.95), 0 0 3px rgba(11,15,21,0.95);
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease;
  }
  .firefly:hover .firefly-label,
  .firefly:focus-visible .firefly-label {
    opacity: 1;
  }
  @keyframes firefly-drift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(var(--dx1, 30px), var(--dy1, -24px)); }
    50%  { transform: translate(var(--dx2, -18px), var(--dy2, -46px)); }
    75%  { transform: translate(var(--dx3, -32px), var(--dy3, 12px)); }
    100% { transform: translate(0, 0); }
  }
  @keyframes firefly-blink {
    0%, 100% { opacity: 0; }
    45%, 55% { opacity: var(--peak, 0.8); }
  }
  @media (prefers-reduced-motion: reduce) {
    .firefly { animation: none; }
    .firefly-dot { animation: none; opacity: var(--peak, 0.5); }
  }

  /* ── Gallery — photographs and nothing else. No collection name,
     no record fields, no transition: clicking a firefly puts you
     straight into the pictures. Big cropped view on the left, the
     rest of the collection on the right.

     `flex: 1` + body's fixed height is what sizes this to exactly
     the space left under the hero — no calc(100vh - something)
     magic number that breaks when the hero's size changes. ── */
  /* ── Gallery — one photograph at a time, shown whole, with room
     around it. No thumbnail strip, no frame, no furniture: the
     picture and a single quiet line under it.

     `object-fit: contain` rather than `cover` — the photograph is
     never cropped to fill a box, so its own proportions are what
     you see, which is also how the archive treats the file and the
     print. That is what makes it fit at any window size, portrait
     or landscape. ── */
  .gallery {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 1600px;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 clamp(48px, 7vw, 120px) clamp(24px, 4vh, 52px);
  }
  .gallery-hidden { display: none; }

  .gallery-stage {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
    min-height: 0;
  }
  .gallery-stage .pic {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  /* -webkit-touch-callout blocks the long-press save sheet on iOS;
     user-drag blocks dragging the file straight out to the desktop. */
  .gallery-stage .pic, .peek {
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* One line under the picture: where you are in the archive, and
     nothing else. Small, wide-tracked, dim. */
  .gallery-meta {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(18px, 3vw, 44px);
    padding-top: clamp(16px, 2.6vh, 30px);
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--steel-dim);
  }
  .gallery-count { font-variant-numeric: tabular-nums; }
  /* Step arrows — at the outer edges, well clear of the picture, and
     nearly invisible until the pointer is near them. Arrow keys do
     the same thing. */
  .gallery-step {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: 0;
    padding: 18px 12px;
    font-family: 'Courier Prime', monospace;
    font-size: 20px;
    line-height: 1;
    color: var(--steel-dim);
    opacity: 0.35;
    cursor: pointer;
    transition: opacity 200ms ease, color 200ms ease, text-shadow 200ms ease;
  }
  .gallery-step:hover,
  .gallery-step:focus-visible {
    opacity: 1;
    color: var(--red);
    text-shadow: var(--glow-text-soft);
    outline: none;
  }
  .gallery-step[hidden] { display: none; }

  /* A sliver of what's on either side, so stepping isn't blind. Dim
     until you go looking; the chevron sits under it. */
  .gallery-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
  }
  .peek {
    width: 48px;
    height: 48px;
    object-fit: cover;
    display: block;
    opacity: 0.3;
    border: 1px solid rgba(147,168,184,0.18);
    transition: opacity 220ms ease, border-color 220ms ease;
  }
  .peek[hidden] { display: none; }
  .gallery-step:hover .peek,
  .gallery-step:focus-visible .peek {
    opacity: 0.92;
    border-color: var(--line-bright);
  }
  .step-mark { display: block; }
  .step-prev { left: clamp(6px, 2vw, 34px); }
  .step-next { right: clamp(6px, 2vw, 34px); }

  .gallery-back {
    position: absolute;
    top: -30px;
    left: clamp(48px, 7vw, 120px);
    background: none;
    border: 0;
    padding: 4px 10px 4px 0;
    font-family: 'Courier Prime', monospace;
    font-size: 16px;
    line-height: 1;
    color: var(--steel-dim);
    opacity: 0.55;
    cursor: pointer;
    transition: color 150ms ease, opacity 150ms ease, text-shadow 150ms ease;
  }
  .gallery-back:hover,
  .gallery-back:focus-visible {
    opacity: 1;
    color: var(--red);
    text-shadow: var(--glow-text-soft);
    outline: none;
  }

  /* Nothing archived here yet. A quiet line rather than a grey
     plate — an empty room reads better than a blank frame hung on
     the wall. Disappears the moment a photograph exists. */
  .stage-empty {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--steel-dim);
    opacity: 0.5;
  }

  /* ── First-look hint — bottom centre, out of the photograph's way,
     dim enough to ignore and gone the moment you press anything. The
     key caps are drawn, not typed: four small plates in the usual
     inverted-T so it reads as a keyboard at a glance. ── */
  .hint {
    position: fixed;
    left: 50%;
    bottom: clamp(20px, 4vh, 48px);
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 18px 30px 16px;
    max-width: min(92vw, 460px);
    text-align: center;
    background: rgba(11, 15, 21, 0.82);
    border: 1px solid rgba(147,168,184,0.16);
    backdrop-filter: blur(3px);
  }
  .hint[hidden] { display: none; }

  .hint-keys {
    display: grid;
    grid-template-columns: repeat(3, 26px);
    grid-template-rows: repeat(2, 26px);
    gap: 4px;
  }
  .key {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    line-height: 1;
    color: var(--steel);
    border: 1px solid rgba(147,168,184,0.35);
    border-radius: 3px;
    background: rgba(147,168,184,0.06);
  }
  .key-up    { grid-column: 2; grid-row: 1; }
  .key-left  { grid-column: 1; grid-row: 2; }
  .key-down  { grid-column: 2; grid-row: 2; }
  .key-right { grid-column: 3; grid-row: 2; }

  /* the keys light up in turn, so it reads as "press these" */
  .key { animation: key-cue 4s ease-in-out infinite; }
  .key-up    { animation-delay: 0s; }
  .key-left  { animation-delay: 0.35s; }
  .key-down  { animation-delay: 0.7s; }
  .key-right { animation-delay: 1.05s; }
  @keyframes key-cue {
    0%, 22%, 100% { border-color: rgba(147,168,184,0.35); color: var(--steel); box-shadow: none; }
    8% { border-color: var(--line-bright); color: var(--red); box-shadow: 0 0 10px rgba(214,71,58,0.35); }
  }

  .hint-line {
    font-family: 'Courier Prime', monospace;
    font-size: 10.5px;
    line-height: 1.85;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--steel);
  }
  .hint-note {
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--steel-dim);
  }
  .hint-close {
    position: absolute;
    top: 4px;
    right: 8px;
    background: none;
    border: 0;
    padding: 4px 6px;
    font-family: 'Courier Prime', monospace;
    font-size: 14px;
    line-height: 1;
    color: var(--steel-dim);
    cursor: pointer;
    transition: color 150ms ease;
  }
  .hint-close:hover, .hint-close:focus-visible { color: var(--red); outline: none; }

  /* Archive hint — same plate, but two rows since there are two axes
     to explain rather than one swarm to stir. */
  .hint-archive { bottom: auto; top: clamp(18px, 3.5vh, 44px); padding: 16px 30px 14px; }
  .hint-rows { display: flex; flex-direction: column; gap: 9px; }
  .hint-row { display: flex; align-items: center; gap: 6px; }
  .hint-row .key { width: 26px; height: 26px; animation: none; }
  .hint-row-text {
    margin-left: 8px;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--steel);
  }

  /* Leaves the same way everything else on this site does. */
  .hint-dismissing { animation: flicker-out 460ms linear forwards; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .key { animation: none; }
    .hint-dismissing { animation: none; opacity: 0; }
  }

  @media (max-width: 720px) {
    .hint { display: none; }
  }

  /* ── Flicker — the whole screen stutters out like a bulb losing
     its connection, then the archive comes up the same way. Same
     visual language as the brand mark's own flicker and the
     fireflies, rather than a generic fade. Irregular steps on
     purpose: an even fade reads as a transition, an uneven one
     reads as electrical. ── */
  @keyframes flicker-out {
    0%   { opacity: 1; }
    8%   { opacity: 0.35; }
    13%  { opacity: 0.95; }
    23%  { opacity: 0.12; }
    29%  { opacity: 0.8; }
    39%  { opacity: 0.08; }
    46%  { opacity: 0.55; }
    57%  { opacity: 0.04; }
    64%  { opacity: 0.3; }
    74%  { opacity: 0.02; }
    82%  { opacity: 0.15; }
    100% { opacity: 0; }
  }
  @keyframes flicker-in {
    0%   { opacity: 0; }
    12%  { opacity: 0.25; }
    19%  { opacity: 0.04; }
    31%  { opacity: 0.6; }
    38%  { opacity: 0.1; }
    52%  { opacity: 0.85; }
    60%  { opacity: 0.35; }
    73%  { opacity: 1; }
    79%  { opacity: 0.6; }
    100% { opacity: 1; }
  }
  body.flicker-out .brandmark-wrap,
  body.flicker-out .fireflies,
  body.flicker-out .gallery {
    animation: flicker-out 460ms linear forwards;
  }
  body.flicker-in .brandmark-wrap,
  body.flicker-in .fireflies,
  body.flicker-in .gallery {
    animation: flicker-in 420ms linear;
  }
  /* The fireflies are the landing; once the archive is up, the
     screen belongs to the photographs. */
  body.viewing .fireflies { display: none; }

  @media (prefers-reduced-motion: reduce) {
    body.flicker-out .brandmark-wrap,
    body.flicker-out .fireflies,
    body.flicker-out .gallery,
    body.flicker-in .brandmark-wrap,
    body.flicker-in .fireflies,
    body.flicker-in .gallery { animation: none; }
  }

  /* The one place the mark changes size: narrow screens, where 28px
     at this tracking would run off the edge. A single step, not a
     continuous scale. */
  @media (max-width: 720px) {
    .brandmark {
      font-size: 18px;
      letter-spacing: 0.26em;
      margin-right: -0.26em;
    }
  }

  @media (max-width: 800px) {
    .gallery { padding: 0 34px clamp(18px, 3vh, 34px); }
    .gallery-back { left: 34px; }
    .gallery-step { padding: 14px 6px; font-size: 17px; }
  }
</style>
</head>
<body>

  <div class="fireflies" id="fireflies"></div>

  <div class="brandmark-wrap">
    <span class="brandmark" id="brandmark">Hausofmemories</span>
  </div>

  <!-- Photographs only. No collection title, no record fields, no
       transition — clicking a firefly lands you straight in the
       pictures. Big cropped view on the left, the rest of the
       collection on the right; picking one swaps the left. -->
  <!-- First-look hint. Says the site answers back, shows which keys,
       and gets out of the way the moment you touch anything. -->
  <div class="hint" id="hint" role="note">
    <div class="hint-keys" aria-hidden="true">
      <span class="key key-up">&uarr;</span>
      <span class="key key-left">&larr;</span>
      <span class="key key-down">&darr;</span>
      <span class="key key-right">&rarr;</span>
    </div>
    <p class="hint-line">Arrow keys send a breeze through the swarm.<br>A light that burns amber has an archive behind it.</p>
    <p class="hint-note">Best on a computer</p>
    <button class="hint-close" id="hintClose" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Shown the first time an archive is opened: the two axes, and
       what each one does. -->
  <div class="hint hint-archive" id="hintArchive" role="note" hidden>
    <div class="hint-rows">
      <div class="hint-row">
        <span class="key">←</span><span class="key">→</span>
        <span class="hint-row-text">through this archive</span>
      </div>
      <div class="hint-row">
        <span class="key">↑</span><span class="key">↓</span>
        <span class="hint-row-text">between archives</span>
      </div>
    </div>
    <button class="hint-close" id="hintArchiveClose" aria-label="Dismiss">×</button>
  </div>

  <div class="gallery gallery-hidden" id="gallery">
    <button class="gallery-back" id="galleryBack" aria-label="Back to the archive">‹ Archive</button>
    <button class="gallery-step step-prev" id="stepPrev" aria-label="Previous photograph">
      <img class="peek" id="peekPrev" alt="" />
      <span class="step-mark">‹</span>
    </button>
    <div class="gallery-stage" id="galleryStage"></div>
    <button class="gallery-step step-next" id="stepNext" aria-label="Next photograph">
      <img class="peek" id="peekNext" alt="" />
      <span class="step-mark">›</span>
    </button>
    <div class="gallery-meta" id="galleryMeta"></div>
  </div>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());

    // Reads directly from archive-data.js — add a collection or an
    // entry there and it shows up here on refresh, nothing to edit
    // in this file.
    const entries = ARCHIVE_ENTRIES.map(e => ({
      id: e.id,
      collection: e.collection,
      title: e.title,
      location: orDefault(e.generalLocation),
      date: formatDate(e.datePhotographed),
      medium: orDefault(e.medium),
      condition: orDefault(e.condition),
      edition: e.editionType === 'limited' ? `Limited, ${e.editionSize}` : (e.editionType === 'open' ? 'Open' : 'Unknown'),
      image: e.image,
      width: e.width,
      height: e.height
    }));

    const gallery = document.getElementById('gallery');
    const stage = document.getElementById('galleryStage');
    const meta = document.getElementById('galleryMeta');
    const galleryBack = document.getElementById('galleryBack');
    const stepPrev = document.getElementById('stepPrev');
    const stepNext = document.getElementById('stepNext');
    const peekPrev = document.getElementById('peekPrev');
    const peekNext = document.getElementById('peekNext');

    let shown = [];
    let activeIndex = null;
    let currentKey = null;

    // Archives with photographs actually in them — the only ones worth
    // stepping between, and the same test the fireflies use.
    function activeArchives() {
      return ARCHIVE_COLLECTIONS
        .filter(c => entries.some(e => e.collection === c.key))
        .map(c => c.key);
    }

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Flicker the screen out, swap what's on it, flicker it back in.
       Timings match the keyframes in the CSS; with reduced motion the
       swap just happens. Guarded so a second click mid-flicker can't
       start an overlapping run. */
    let flickering = false;
    function flickerSwap(swap) {
      if (reducedMotion) { swap(); return; }
      if (flickering) return;
      flickering = true;
      document.body.classList.add('flicker-out');
      setTimeout(() => {
        swap();
        document.body.classList.remove('flicker-out');
        document.body.classList.add('flicker-in');
        setTimeout(() => {
          document.body.classList.remove('flicker-in');
          flickering = false;
        }, 420);
      }, 460);
    }

    /* One photograph, shown whole. No crop: the file's own
       proportions are what's on screen, same as the print. */
    function showPhoto(i) {
      if (!shown.length) return;
      activeIndex = i;
      const e = shown[i];
      stage.innerHTML = e.image
        ? `<img class="pic" src="${e.image}" alt="" />`
        : '<p class="stage-empty">Not yet archived</p>';
      // Position only. No print offer — that page is gone.
      meta.innerHTML = `
        <span class="gallery-count">${String(i + 1).padStart(2, '0')} / ${String(shown.length).padStart(2, '0')}</span>
      `;
      // Only offer the steps when there is somewhere to step to.
      const many = shown.length > 1;
      stepPrev.hidden = !many;
      stepNext.hidden = !many;

      // A sliver of what's either side, so you can see where you're
      // about to go rather than stepping blind.
      if (many) {
        const prevE = shown[(i - 1 + shown.length) % shown.length];
        const nextE = shown[(i + 1) % shown.length];
        [[peekPrev, prevE], [peekNext, nextE]].forEach(([el, e2]) => {
          if (!el) return;
          if (e2 && e2.image) { el.src = e2.image; el.hidden = false; }
          else { el.removeAttribute('src'); el.hidden = true; }
        });
      }
    }

    /* Up and down move between archives — the same flicker as opening
       one, since it's the same kind of change: the whole screen
       becomes a different archive. Wraps, and only visits archives
       that have photographs in them. */
    function stepArchive(delta) {
      const keys = activeArchives();
      if (keys.length < 2 || currentKey === null) return;
      const at = keys.indexOf(currentKey);
      if (at === -1) return;
      openCollection(keys[(at + delta + keys.length) % keys.length]);
    }

    // Left/right through the archive, wrapping at either end.
    function step(delta) {
      if (!shown.length || activeIndex === null) return;
      showPhoto((activeIndex + delta + shown.length) % shown.length);
    }

    // Open an archive: the screen flickers out, then the photograph
    // is what comes up. No title, nothing else.
    function openCollection(key) {
      flickerSwap(() => {
        shown = entries.filter(e => e.collection === key);
        activeIndex = null;
        currentKey = key;

        gallery.classList.remove('gallery-hidden');
        document.body.classList.add('viewing');

        if (shown.length) {
          showPhoto(0);
        } else {
          // Nothing archived here yet — a quiet line rather than
          // blank space, and nothing to step through or buy.
          stage.innerHTML = '<p class="stage-empty">Nothing archived yet</p>';
          meta.innerHTML = '';
          stepPrev.hidden = true;
          stepNext.hidden = true;
        }
        galleryBack.focus();
        if (window.__showArchiveHint) window.__showArchiveHint();
      });
    }

    function closeGallery() {
      flickerSwap(() => {
        gallery.classList.add('gallery-hidden');
        document.body.classList.remove('viewing');
        shown = [];
        activeIndex = null;
        currentKey = null;
        stage.innerHTML = '';
        meta.innerHTML = '';
      });
    }

    galleryBack.addEventListener('click', closeGallery);
    stepPrev.addEventListener('click', () => step(-1));
    stepNext.addEventListener('click', () => step(1));

    document.addEventListener('keydown', (ev) => {
      if (gallery.classList.contains('gallery-hidden')) return;
      if (ev.key === 'Escape') { closeGallery(); return; }
      if (ev.key === 'ArrowLeft')  { ev.preventDefault(); step(-1); }
      if (ev.key === 'ArrowRight') { ev.preventDefault(); step(1); }
      if (ev.key === 'ArrowUp')    { ev.preventDefault(); stepArchive(-1); }
      if (ev.key === 'ArrowDown')  { ev.preventDefault(); stepArchive(1); }
    });

    /* The archive hint: shown the first time an archive opens, then
       not again for the rest of the visit. Same dismissal as the
       landing one — click, Esc, or an arrow key, since pressing an
       arrow is the thing it's describing. */
    (function () {
      const h = document.getElementById('hintArchive');
      if (!h) return;
      let used = false, gone = false;
      function dismiss() {
        if (gone || h.hidden) return;
        gone = true;
        h.classList.add('hint-dismissing');
        setTimeout(() => { h.hidden = true; }, 480);
      }
      window.__showArchiveHint = function () {
        if (used || window.matchMedia('(max-width: 720px)').matches) return;
        used = true;
        h.hidden = false;
      };
      document.getElementById('hintArchiveClose').addEventListener('click', dismiss);
      h.addEventListener('click', dismiss);
      document.addEventListener('keydown', (ev) => {
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape'].includes(ev.key)) dismiss();
      });
    })();

    /* The hint leaves on the first sign you've read it — a click, Esc,
       or any arrow key, which both dismisses it and is the thing it
       was telling you about. Flickers out rather than fading, same as
       every other transition here. */
    (function () {
      const hint = document.getElementById('hint');
      if (!hint) return;
      let gone = false;
      function dismiss() {
        if (gone) return;
        gone = true;
        hint.classList.add('hint-dismissing');
        setTimeout(() => { hint.hidden = true; }, 480);
      }
      document.getElementById('hintClose').addEventListener('click', dismiss);
      hint.addEventListener('click', dismiss);
      document.addEventListener('keydown', (ev) => {
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape'].includes(ev.key)) dismiss();
      });
      // opening an archive counts as having got the idea
      document.getElementById('fireflies').addEventListener('click', dismiss, true);
    })();

    // Brand mark — sits still, then flickers like a light bulb with
    // a loose connection, in short, irregular bursts.
    (function () {
      const mark = document.getElementById('brandmark');
      if (!mark || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      function rand(min, max) { return Math.random() * (max - min) + min; }

      // A burst of irregular brightness dips, like a bulb with a
      // loose connection — random number of flickers, random depth,
      // random spacing. No two bursts look the same.
      function flicker() {
        const steps = Math.floor(rand(3, 9));
        let t = 0;
        for (let i = 0; i < steps; i++) {
          t += rand(20, 110);
          const dip = rand(0.1, 0.65);
          setTimeout(() => { mark.style.opacity = dip; }, t);
          t += rand(15, 70);
          setTimeout(() => { mark.style.opacity = '1'; }, t);
        }
        schedule();
      }

      function schedule() {
        setTimeout(flicker, rand(2600, 7500));
      }

      schedule();
    })();

    // Fireflies — this is the navigation now, replacing the card
    // grid entirely. One firefly per collection in ARCHIVE_COLLECTIONS,
    // spread across the viewport (jittered grid, so 30 of them don't
    // clump), each fully randomized in drift/blink timing so no two
    // move the same way. Hovering or focusing one shows its archive
    // number ("ARCHIVE 0001", not the category name) and clicking —
    // or Enter/Space when focused — opens that collection, the same
    // way a card used to. Lives in a fixed, clipped layer (see
    // .fireflies in the CSS) so it never affects page height or
    // causes scrolling.
    (function () {
      const fieldOuter = document.getElementById('fireflies');
      if (!fieldOuter || typeof ARCHIVE_COLLECTIONS === 'undefined') return;
      /* Two layers: the empty red ones stay where they are, the amber
         ones with archives behind them are the swarm you steer. Same
         clipping box, so nothing else changes. */
      const layerStill = document.createElement('div');
      layerStill.className = 'firefly-layer';
      const layerSteer = document.createElement('div');
      layerSteer.className = 'firefly-layer firefly-layer-steer';
      fieldOuter.appendChild(layerStill);
      fieldOuter.appendChild(layerSteer);
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function rand(min, max) { return Math.random() * (max - min) + min; }
      function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

      // Popped, but not gone for good — it comes back somewhere else
      // in its own cell after a random wait, so the field keeps
      // shifting rather than emptying out as you click through it.
      function popFirefly(f, col, i) {
        if (f.classList.contains('firefly-popping')) return;
        f.classList.add('firefly-popping');
        setTimeout(() => {
          f.remove();
          setTimeout(() => spawn(col, i), rand(5000, 18000));
        }, 420);
      }

      // Clustered around the brand mark rather than spread
      // edge-to-edge, so they read as orbiting the hero text.
      // The region is MEASURED off the mark's real rendered box
      // instead of being hardcoded — move the hero (padding,
      // alignment, font size, viewport) and the swarm follows it
      // on its own, with no numbers here to re-tune.
      const hero = document.querySelector('.brandmark');
      const REGION = (() => {
        const fallback = { xMin: 22, xMax: 78, yMin: 20, yMax: 70 };
        if (!hero) return fallback;
        const r = hero.getBoundingClientRect();
        if (!r.width || !r.height) return fallback;
        const cx = ((r.left + r.width / 2) / window.innerWidth) * 100;
        const cy = ((r.top + r.height / 2) / window.innerHeight) * 100;
        // Orbs drift up to ~60px upward from where they're placed,
        // so the band has to start at least that far down or the
        // top row gets clipped off-screen (and becomes unclickable)
        // on shorter viewports. Expressed in px-derived percent so
        // it holds at any window height.
        const topFloor = Math.max(5, (70 / window.innerHeight) * 100);
        return {
          // Wider than the mark itself so they surround it rather
          // than sit in a tight line, and weighted downward since
          // there's little room above once the hero is near the top.
          xMin: clamp(cx - 32, 4, 46),
          xMax: clamp(cx + 32, 54, 96),
          yMin: clamp(cy - 16, topFloor, 45),
          yMax: clamp(cy + 42, 50, 93)
        };
      })();
      const count = ARCHIVE_COLLECTIONS.length;
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / cols);
      const cellW = (REGION.xMax - REGION.xMin) / cols;
      const cellH = (REGION.yMax - REGION.yMin) / rows;

      function spawn(col, i) {
        const cellX = REGION.xMin + (i % cols) * cellW + cellW / 2;
        const cellY = REGION.yMin + Math.floor(i / cols) * cellH + cellH / 2;
        const x = clamp(cellX + rand(-cellW * 0.35, cellW * 0.35), REGION.xMin - 3, REGION.xMax + 3);
        const y = clamp(cellY + rand(-cellH * 0.35, cellH * 0.35), REGION.yMin - 3, REGION.yMax + 3);
        const archiveNum = String(i + 1).padStart(4, '0');

        // Empty archive -> red. Driven off the actual entries, so it
        // flips to amber by itself as soon as photographs land in it.
        const hasPhotos = entries.some(e => e.collection === col.key);

        const f = document.createElement('div');
        f.className = hasPhotos ? 'firefly' : 'firefly firefly-empty';
        f.dataset.key = col.key;
        f.tabIndex = 0;
        f.setAttribute('role', 'button');
        f.setAttribute('aria-label', hasPhotos ? `Open Archive ${archiveNum}` : `Archive ${archiveNum}, empty`);
        f.style.setProperty('--x', `${x.toFixed(2)}%`);
        f.style.setProperty('--y', `${y.toFixed(2)}%`);

        if (!reduced) {
          f.style.setProperty('--size', `${rand(2.5, 5).toFixed(1)}px`);
          f.style.setProperty('--dx1', `${rand(15, 45).toFixed(0)}px`);
          f.style.setProperty('--dy1', `${rand(-40, -10).toFixed(0)}px`);
          f.style.setProperty('--dx2', `${rand(-30, -10).toFixed(0)}px`);
          f.style.setProperty('--dy2', `${rand(-60, -25).toFixed(0)}px`);
          f.style.setProperty('--dx3', `${rand(-45, -15).toFixed(0)}px`);
          f.style.setProperty('--dy3', `${rand(5, 25).toFixed(0)}px`);
          f.style.setProperty('--dur', `${rand(16, 30).toFixed(1)}s`);
          f.style.setProperty('--delay', `${rand(0, -20).toFixed(1)}s`);
          f.style.setProperty('--blink-dur', `${rand(3, 6.5).toFixed(1)}s`);
          f.style.setProperty('--blink-delay', `${rand(0, -6).toFixed(1)}s`);
          f.style.setProperty('--peak', rand(0.55, 0.9).toFixed(2));
        } else {
          f.style.setProperty('--peak', (0.3 + Math.random() * 0.25).toFixed(2));
        }

        const dot = document.createElement('span');
        dot.className = 'firefly-dot';

        const label = document.createElement('span');
        label.className = 'firefly-label';
        label.textContent = `Archive ${archiveNum}`;

        f.appendChild(dot);
        f.appendChild(label);
        (hasPhotos ? layerSteer : layerStill).appendChild(f);

        // A filled archive opens. An empty one has nothing behind it,
        // so it pops instead and leaves the field.
        const act = hasPhotos
          ? () => openCollection(col.key)
          : () => popFirefly(f, col, i);
        f.addEventListener('click', act);
        f.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); }
        });
      }

      ARCHIVE_COLLECTIONS.forEach((col, i) => spawn(col, i));

      /* Arrow keys are wind. The arrow says where the gust comes FROM,
         so Left blows the swarm to the right. Only the amber ones —
         archives with photographs — get caught by it.

         A gust, not a pan: the wind sweeps across the field so orbs on
         the windward side are hit first, each takes a different amount
         of push plus sideways turbulence, and then they drift back
         over a second or three at their own pace. Nothing snaps, and
         nothing moves together. */
      const galleryEl = document.getElementById('gallery');
      const FROM = {
        ArrowLeft:  [ 1,  0],
        ArrowRight: [-1,  0],
        ArrowUp:    [ 0,  1],
        ArrowDown:  [ 0, -1]
      };

      function gust(ux, uy) {
        /* Every gust is its own weather. One press might be a light
           breath, the next a real shove — and wind is patchy, so some
           orbs sit in still air and aren't caught at all. */
        const force  = rand(0.5, 1.6);    // how hard this particular gust blows
        const sweep  = rand(110, 480);    // how fast it crosses the field
        const churn  = rand(6, 26);       // how turbulent it is
        const miss   = rand(0.05, 0.3);   // share of orbs it passes over

        layerSteer.querySelectorAll('.firefly').forEach((f) => {
          if (Math.random() < miss) return;
          const r = f.getBoundingClientRect();
          // how far downwind it sits — decides when the gust reaches it
          const along = ux !== 0
            ? (ux > 0 ? r.left / window.innerWidth : 1 - r.left / window.innerWidth)
            : (uy > 0 ? r.top / window.innerHeight : 1 - r.top / window.innerHeight);
          const hit = along * sweep;
          const push = rand(26, 72) * force;
          const cross = rand(-churn, churn);
          const gx = ux !== 0 ? ux * push : cross;
          const gy = uy !== 0 ? uy * push : cross;

          /* Caught and spun. The dot swings out from its own centre
             and the orb turns, so the pair reads as a twirl rather
             than a spin-in-place — a circle rotating on the spot
             would look like nothing at all. The angle accumulates and
             is never wound back, so it always turns forwards; the
             swing radius returns to zero, so it spirals back in and
             settles instead of stopping dead. */
          const spin = (Number(f.dataset.spin) || 0) + rand(14, 70) * force * (Math.random() < 0.5 ? -1 : 1);
          f.dataset.spin = spin;
          const swing = rand(2, 6.5);
          const blow = rand(420, 780);

          f.style.transitionProperty = 'translate, rotate';
          f.style.transitionTimingFunction = 'cubic-bezier(0.33, 0.6, 0.4, 1)';
          f.style.transitionDuration = blow.toFixed(0) + 'ms';
          f.style.transitionDelay = hit.toFixed(0) + 'ms';
          f.style.translate = gx.toFixed(1) + 'px ' + gy.toFixed(1) + 'px';
          f.style.rotate = spin.toFixed(0) + 'deg';

          const dotEl = f.querySelector('.firefly-dot');
          if (dotEl) {
            dotEl.style.transitionDuration = blow.toFixed(0) + 'ms';
            dotEl.style.transitionDelay = hit.toFixed(0) + 'ms';
            dotEl.style.translate = swing.toFixed(1) + 'px 0px';
          }

          setTimeout(() => {
            const settle = rand(2200, 4600);
            f.style.transitionTimingFunction = 'cubic-bezier(0.25, 0.55, 0.3, 1)';
            f.style.transitionDuration = settle.toFixed(0) + 'ms';
            f.style.transitionDelay = '0ms';
            f.style.translate = '0px 0px';
            // keeps turning a little as it comes back, then rests
            f.style.rotate = (spin + rand(4, 22) * Math.sign(spin || 1)).toFixed(0) + 'deg';
            if (dotEl) {
              dotEl.style.transitionDuration = settle.toFixed(0) + 'ms';
              dotEl.style.transitionDelay = '0ms';
              dotEl.style.translate = '0px 0px';
            }
          }, hit + rand(520, 1000));
        });
      }

      document.addEventListener('keydown', (ev) => {
        if (!galleryEl || !galleryEl.classList.contains('gallery-hidden')) return;
        const dir = FROM[ev.key];
        if (!dir) return;
        ev.preventDefault();
        if (!reduced) gust(dir[0], dir[1]);
      });

    })();
  </script>
</body>
</html>
