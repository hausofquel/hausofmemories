<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Haus of Memories — A Photographic Archive</title>
<meta name="description" content="Haus of Memories is a photographic archive preserving graffiti, trains, walls, and other visual moments that would otherwise disappear." />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500&family=Libre+Caslon+Text:ital@0;1&display=swap">
<script src="archive-data.js"></script>
<style>
  :root {
    --bg-1: #0b0f15;
    --bg-2: #101722;
    --steel: #93a8b8;
    --steel-dim: rgba(147,168,184,0.5);
    --line: rgba(214,72,58,0.28);
    --line-bright: rgba(214,72,58,0.55);
    --red: #d6473a;
    --glow: rgba(214,71,58,0.55);
    /* Layered glow, same technique as HPNTK's --acid-glow: a tight
       bright core, a mid halo, a wide soft diffusion — recolored
       to this project's red instead of HPNTK's acid blue. */
    --glow-text: 0 0 6px rgba(214,71,58,0.85), 0 0 14px rgba(214,71,58,0.55), 0 0 26px rgba(214,71,58,0.3);
    --glow-text-soft: 0 0 4px rgba(214,71,58,0.4), 0 0 12px rgba(214,71,58,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg-1);
    /* HUD grid — a real ruled grid instead of a faint dot texture,
       turned up enough to actually read as a grid. */
    background-image:
      radial-gradient(ellipse 80% 60% at 15% 0%, rgba(0,0,0,0.55) 0%, transparent 62%),
      radial-gradient(ellipse 70% 50% at 100% 100%, rgba(0,0,0,0.5) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(147,168,184,0.09) 0, rgba(147,168,184,0.09) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(147,168,184,0.09) 0, rgba(147,168,184,0.09) 1px, transparent 1px, transparent 42px);
    background-size: auto, auto, 42px 42px, 42px 42px;
    color: var(--steel);
    font-family: 'Libre Caslon Text', Georgia, serif;
    min-height: 100vh;
    /* Brand mark and the grid stack in real document flow now (see
       .brandmark-wrap below) instead of the mark floating on top as
       a `position: fixed` overlay — this flex column is what keeps
       both pieces centered as a unit, so the mark can never render
       on top of the cards again: it physically occupies its own
       space above them. */
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Landing: the mark sits dead centre of the page, since it is
       the only thing in flow there. Once a gallery is open the body
       gets .viewing and the mark moves to the top so the pictures
       get the rest of the height. */
    justify-content: center;
  }
  body.viewing { justify-content: flex-start; }


  /* ── Brand mark — the one piece of pure white on the page, so it
     reads as the brightest thing on screen against the red glow and
     cool grays everywhere else. Sits mostly still, then flickers
     like a bulb with a loose connection — brightness dips driven
     from JS since a real flicker is irregular, never the same shape
     twice, not a single repeating keyframe.

     This sits in normal document flow, directly above `.comb`, as
     a plain block in body's centered flex column — not a
     `position: fixed` overlay guessed into place with a calc(vh)
     offset. A fixed overlay can only ever be *near* the grid; it
     has no idea how tall the grid actually rendered, so it can end
     up sitting on top of it (which is exactly what happened). In
     flow, that's structurally impossible: the margin below is real
     space the next element is pushed out of, on every screen size,
     with no math to keep re-tuning. ── */
  .brandmark-wrap {
    position: relative;
    z-index: 2;
    /* No padding on the landing view — any padding or margin here is
       part of the flex item's outer box, so it would push the actual
       letters off true centre. The breathing room is only wanted in
       the gallery view, where the mark is top-anchored instead. */
    padding-top: 0;
    margin-bottom: 0;
    /* pointer-events: none matters more than it looks — fireflies
       drifting behind the hero text stay clickable through it. */
    pointer-events: none;
    user-select: none;
  }
  body.viewing .brandmark-wrap {
    padding-top: clamp(40px, 7vh, 86px);
    margin-bottom: clamp(24px, 4vh, 52px);
  }

  .brandmark {
    display: inline-block;
    /* Cleaner sans at a smaller size — Inter at a light weight with
       open letter-spacing, instead of the heavy Archivo Black
       display face. */
    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    /* One fixed size, not a vw-scaled clamp. A clamp re-computes on
       every window width, so the mark visibly changed size as the
       window was resized (measured: 23px at a 1000px window, 27.6px
       at 1200px, 28px above ~1218px). It holds one size now and
       steps down once, at phone width, via the media query below. */
    font-size: 28px;
    letter-spacing: 0.34em;
    /* letter-spacing adds its gap after the LAST letter too, so that
       trailing space counts in the box width and the visible letters
       end up sitting half a gap left of centre (measured: 5px off at
       this size). Pulling the trailing gap back off the box makes it
       hug the actual ink, so centring the box centres the letters. */
    margin-right: -0.34em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.55), 0 0 26px rgba(255,255,255,0.3);
    opacity: 1;
  }

  /* ── Fireflies — now the actual navigation, replacing the card
     grid. `position: fixed` + `inset: 0` + `overflow: hidden` on
     the field keeps this layer locked to the viewport: it can
     never add to the page's height or cause scrolling, no matter
     how far a given orb's drift path wanders (it just gets
     clipped). Negative z-index keeps it behind the brand mark and
     any open gallery without needing z-index set everywhere else.

     Each `.firefly` is a real hit area (26px, generous — the glow
     itself is tiny) that drifts; the visible glow is a separate
     inner `.firefly-dot` that blinks independently, so the click
     target doesn't shrink to a few dim pixels. Hovering or
     focusing one pauses its drift, forces it fully bright, and
     reveals its archive number as a label — that's the one thing
     replacing what used to be printed on the card. ── */
  .fireflies {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    /* NOT z-index: -1. A negative z-index puts this whole layer
       behind the body box, and hit-testing follows paint order —
       so every click and hover landed on BODY instead of a
       firefly, making them un-clickable. Sitting at 0 with the
       brand mark and gallery lifted to 2 keeps them visually
       behind everything while still reachable by the pointer. */
    z-index: 0;
  }
  .firefly {
    position: absolute;
    left: var(--x, 50%);
    top: var(--y, 50%);
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    animation: firefly-drift var(--dur, 20s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .firefly:hover,
  .firefly:focus-visible {
    animation-play-state: paused;
    outline: none;
  }
  .firefly-dot {
    width: var(--size, 4px);
    height: var(--size, 4px);
    border-radius: 50%;
    background: #f4d998;
    box-shadow: 0 0 4px 1px rgba(244,217,152,0.9), 0 0 12px 4px rgba(244,217,152,0.35);
    opacity: 0;
    animation: firefly-blink var(--blink-dur, 4.5s) ease-in-out infinite;
    animation-delay: var(--blink-delay, 0s);
    transition: opacity 150ms ease, transform 150ms ease, box-shadow 150ms ease;
  }
  .firefly:hover .firefly-dot,
  .firefly:focus-visible .firefly-dot {
    opacity: 1 !important;
    transform: scale(1.8);
    box-shadow: 0 0 6px 2px rgba(244,217,152,0.95), 0 0 18px 8px rgba(244,217,152,0.5);
  }
  .firefly-label {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%) translateY(-4px);
    white-space: nowrap;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--steel);
    text-shadow: 0 0 8px rgba(11,15,21,0.95), 0 0 3px rgba(11,15,21,0.95);
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease;
  }
  .firefly:hover .firefly-label,
  .firefly:focus-visible .firefly-label {
    opacity: 1;
  }
  @keyframes firefly-drift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(var(--dx1, 30px), var(--dy1, -24px)); }
    50%  { transform: translate(var(--dx2, -18px), var(--dy2, -46px)); }
    75%  { transform: translate(var(--dx3, -32px), var(--dy3, 12px)); }
    100% { transform: translate(0, 0); }
  }
  @keyframes firefly-blink {
    0%, 100% { opacity: 0; }
    45%, 55% { opacity: var(--peak, 0.8); }
  }
  @media (prefers-reduced-motion: reduce) {
    .firefly { animation: none; }
    .firefly-dot { animation: none; opacity: var(--peak, 0.5); }
  }

  /* ── Gallery — photographs and nothing else. No collection name,
     no record fields, no transition: clicking a firefly puts you
     straight into the pictures. Big cropped view on the left, the
     rest of the collection on the right.

     `flex: 1` + body's fixed height is what sizes this to exactly
     the space left under the hero — no calc(100vh - something)
     magic number that breaks when the hero's size changes. ── */
  /* ── Gallery — one photograph at a time, shown whole, with room
     around it. No thumbnail strip, no frame, no furniture: the
     picture and a single quiet line under it.

     `object-fit: contain` rather than `cover` — the photograph is
     never cropped to fill a box, so its own proportions are what
     you see, which is also how the archive treats the file and the
     print. That is what makes it fit at any window size, portrait
     or landscape. ── */
  .gallery {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 1600px;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 clamp(48px, 7vw, 120px) clamp(24px, 4vh, 52px);
  }
  .gallery-hidden { display: none; }

  .gallery-stage {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
    min-height: 0;
  }
  .gallery-stage .pic {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  /* One line under the picture: where you are, and the only offer
     on the page. Small, wide-tracked, dim until wanted. */
  .gallery-meta {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(18px, 3vw, 44px);
    padding-top: clamp(16px, 2.6vh, 30px);
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--steel-dim);
  }
  .gallery-count { font-variant-numeric: tabular-nums; }
  .gallery-buy {
    color: var(--steel-dim);
    text-decoration: none;
    border-bottom: 1px solid rgba(147,168,184,0.28);
    padding-bottom: 3px;
    transition: color 180ms ease, border-color 180ms ease, text-shadow 180ms ease;
  }
  .gallery-buy:hover {
    color: var(--red);
    border-color: var(--line-bright);
    text-shadow: var(--glow-text-soft);
  }

  /* Step arrows — at the outer edges, well clear of the picture, and
     nearly invisible until the pointer is near them. Arrow keys do
     the same thing. */
  .gallery-step {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: 0;
    padding: 18px 12px;
    font-family: 'Courier Prime', monospace;
    font-size: 20px;
    line-height: 1;
    color: var(--steel-dim);
    opacity: 0.35;
    cursor: pointer;
    transition: opacity 200ms ease, color 200ms ease, text-shadow 200ms ease;
  }
  .gallery-step:hover,
  .gallery-step:focus-visible {
    opacity: 1;
    color: var(--red);
    text-shadow: var(--glow-text-soft);
    outline: none;
  }
  .gallery-step[hidden] { display: none; }
  .step-prev { left: clamp(6px, 2vw, 34px); }
  .step-next { right: clamp(6px, 2vw, 34px); }

  .gallery-back {
    position: absolute;
    top: -30px;
    left: clamp(48px, 7vw, 120px);
    background: none;
    border: 0;
    padding: 4px 10px 4px 0;
    font-family: 'Courier Prime', monospace;
    font-size: 16px;
    line-height: 1;
    color: var(--steel-dim);
    opacity: 0.55;
    cursor: pointer;
    transition: color 150ms ease, opacity 150ms ease, text-shadow 150ms ease;
  }
  .gallery-back:hover,
  .gallery-back:focus-visible {
    opacity: 1;
    color: var(--red);
    text-shadow: var(--glow-text-soft);
    outline: none;
  }

  /* Nothing archived here yet. A quiet line rather than a grey
     plate — an empty room reads better than a blank frame hung on
     the wall. Disappears the moment a photograph exists. */
  .stage-empty {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--steel-dim);
    opacity: 0.5;
  }

  /* ── Flicker — the whole screen stutters out like a bulb losing
     its connection, then the archive comes up the same way. Same
     visual language as the brand mark's own flicker and the
     fireflies, rather than a generic fade. Irregular steps on
     purpose: an even fade reads as a transition, an uneven one
     reads as electrical. ── */
  @keyframes flicker-out {
    0%   { opacity: 1; }
    8%   { opacity: 0.35; }
    13%  { opacity: 0.95; }
    23%  { opacity: 0.12; }
    29%  { opacity: 0.8; }
    39%  { opacity: 0.08; }
    46%  { opacity: 0.55; }
    57%  { opacity: 0.04; }
    64%  { opacity: 0.3; }
    74%  { opacity: 0.02; }
    82%  { opacity: 0.15; }
    100% { opacity: 0; }
  }
  @keyframes flicker-in {
    0%   { opacity: 0; }
    12%  { opacity: 0.25; }
    19%  { opacity: 0.04; }
    31%  { opacity: 0.6; }
    38%  { opacity: 0.1; }
    52%  { opacity: 0.85; }
    60%  { opacity: 0.35; }
    73%  { opacity: 1; }
    79%  { opacity: 0.6; }
    100% { opacity: 1; }
  }
  body.flicker-out .brandmark-wrap,
  body.flicker-out .fireflies,
  body.flicker-out .gallery {
    animation: flicker-out 460ms linear forwards;
  }
  body.flicker-in .brandmark-wrap,
  body.flicker-in .fireflies,
  body.flicker-in .gallery {
    animation: flicker-in 420ms linear;
  }
  /* The fireflies are the landing; once the archive is up, the
     screen belongs to the photographs. */
  body.viewing .fireflies { display: none; }

  @media (prefers-reduced-motion: reduce) {
    body.flicker-out .brandmark-wrap,
    body.flicker-out .fireflies,
    body.flicker-out .gallery,
    body.flicker-in .brandmark-wrap,
    body.flicker-in .fireflies,
    body.flicker-in .gallery { animation: none; }
  }

  /* The one place the mark changes size: narrow screens, where 28px
     at this tracking would run off the edge. A single step, not a
     continuous scale. */
  @media (max-width: 720px) {
    .brandmark {
      font-size: 18px;
      letter-spacing: 0.26em;
      margin-right: -0.26em;
    }
  }

  @media (max-width: 800px) {
    .gallery { padding: 0 34px clamp(18px, 3vh, 34px); }
    .gallery-back { left: 34px; }
    .gallery-step { padding: 14px 6px; font-size: 17px; }
  }
</style>
</head>
<body>

  <div class="fireflies" id="fireflies"></div>

  <div class="brandmark-wrap">
    <span class="brandmark" id="brandmark">Hausofmemories</span>
  </div>

  <!-- Photographs only. No collection title, no record fields, no
       transition — clicking a firefly lands you straight in the
       pictures. Big cropped view on the left, the rest of the
       collection on the right; picking one swaps the left. -->
  <div class="gallery gallery-hidden" id="gallery">
    <button class="gallery-back" id="galleryBack" aria-label="Back to the archive">‹ Archive</button>
    <button class="gallery-step step-prev" id="stepPrev" aria-label="Previous photograph">‹</button>
    <div class="gallery-stage" id="galleryStage"></div>
    <button class="gallery-step step-next" id="stepNext" aria-label="Next photograph">›</button>
    <div class="gallery-meta" id="galleryMeta"></div>
  </div>

  <script>
    // Reads directly from archive-data.js — add a collection or an
    // entry there and it shows up here on refresh, nothing to edit
    // in this file.
    const entries = ARCHIVE_ENTRIES.map(e => ({
      id: e.id,
      collection: e.collection,
      title: e.title,
      location: orDefault(e.generalLocation),
      date: formatDate(e.datePhotographed),
      medium: orDefault(e.medium),
      condition: orDefault(e.condition),
      edition: e.editionType === 'limited' ? `Limited, ${e.editionSize}` : (e.editionType === 'open' ? 'Open' : 'Unknown'),
      image: e.image,
      width: e.width,
      height: e.height
    }));

    const gallery = document.getElementById('gallery');
    const stage = document.getElementById('galleryStage');
    const meta = document.getElementById('galleryMeta');
    const galleryBack = document.getElementById('galleryBack');
    const stepPrev = document.getElementById('stepPrev');
    const stepNext = document.getElementById('stepNext');

    let shown = [];
    let activeIndex = null;

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Flicker the screen out, swap what's on it, flicker it back in.
       Timings match the keyframes in the CSS; with reduced motion the
       swap just happens. Guarded so a second click mid-flicker can't
       start an overlapping run. */
    let flickering = false;
    function flickerSwap(swap) {
      if (reducedMotion) { swap(); return; }
      if (flickering) return;
      flickering = true;
      document.body.classList.add('flicker-out');
      setTimeout(() => {
        swap();
        document.body.classList.remove('flicker-out');
        document.body.classList.add('flicker-in');
        setTimeout(() => {
          document.body.classList.remove('flicker-in');
          flickering = false;
        }, 420);
      }, 460);
    }

    /* One photograph, shown whole. No crop: the file's own
       proportions are what's on screen, same as the print. */
    function showPhoto(i) {
      if (!shown.length) return;
      activeIndex = i;
      const e = shown[i];
      stage.innerHTML = e.image
        ? `<img class="pic" src="${e.image}" alt="" />`
        : '<p class="stage-empty">Not yet archived</p>';
      // No print offered for a record whose photograph isn't in the
      // archive yet — there is nothing to sell or show.
      meta.innerHTML = `
        <span class="gallery-count">${String(i + 1).padStart(2, '0')} / ${String(shown.length).padStart(2, '0')}</span>
        ${e.image ? `<a class="gallery-buy" href="item.html?id=${e.id}">Order a Print</a>` : ''}
      `;
      // Only offer the steps when there is somewhere to step to.
      const many = shown.length > 1;
      stepPrev.hidden = !many;
      stepNext.hidden = !many;
    }

    // Left/right through the archive, wrapping at either end.
    function step(delta) {
      if (!shown.length || activeIndex === null) return;
      showPhoto((activeIndex + delta + shown.length) % shown.length);
    }

    // Open an archive: the screen flickers out, then the photograph
    // is what comes up. No title, nothing else.
    function openCollection(key) {
      flickerSwap(() => {
        shown = entries.filter(e => e.collection === key);
        activeIndex = null;

        gallery.classList.remove('gallery-hidden');
        document.body.classList.add('viewing');

        if (shown.length) {
          showPhoto(0);
        } else {
          // Nothing archived here yet — a quiet line rather than
          // blank space, and nothing to step through or buy.
          stage.innerHTML = '<p class="stage-empty">Nothing archived yet</p>';
          meta.innerHTML = '';
          stepPrev.hidden = true;
          stepNext.hidden = true;
        }
        galleryBack.focus();
      });
    }

    function closeGallery() {
      flickerSwap(() => {
        gallery.classList.add('gallery-hidden');
        document.body.classList.remove('viewing');
        shown = [];
        activeIndex = null;
        stage.innerHTML = '';
        meta.innerHTML = '';
      });
    }

    galleryBack.addEventListener('click', closeGallery);
    stepPrev.addEventListener('click', () => step(-1));
    stepNext.addEventListener('click', () => step(1));

    document.addEventListener('keydown', (ev) => {
      if (gallery.classList.contains('gallery-hidden')) return;
      if (ev.key === 'Escape') { closeGallery(); return; }
      if (ev.key === 'ArrowLeft')  { ev.preventDefault(); step(-1); }
      if (ev.key === 'ArrowRight') { ev.preventDefault(); step(1); }
    });

    // Brand mark — sits still, then flickers like a light bulb with
    // a loose connection, in short, irregular bursts.
    (function () {
      const mark = document.getElementById('brandmark');
      if (!mark || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      function rand(min, max) { return Math.random() * (max - min) + min; }

      // A burst of irregular brightness dips, like a bulb with a
      // loose connection — random number of flickers, random depth,
      // random spacing. No two bursts look the same.
      function flicker() {
        const steps = Math.floor(rand(3, 9));
        let t = 0;
        for (let i = 0; i < steps; i++) {
          t += rand(20, 110);
          const dip = rand(0.1, 0.65);
          setTimeout(() => { mark.style.opacity = dip; }, t);
          t += rand(15, 70);
          setTimeout(() => { mark.style.opacity = '1'; }, t);
        }
        schedule();
      }

      function schedule() {
        setTimeout(flicker, rand(2600, 7500));
      }

      schedule();
    })();

    // Fireflies — this is the navigation now, replacing the card
    // grid entirely. One firefly per collection in ARCHIVE_COLLECTIONS,
    // spread across the viewport (jittered grid, so 30 of them don't
    // clump), each fully randomized in drift/blink timing so no two
    // move the same way. Hovering or focusing one shows its archive
    // number ("ARCHIVE 0001", not the category name) and clicking —
    // or Enter/Space when focused — opens that collection, the same
    // way a card used to. Lives in a fixed, clipped layer (see
    // .fireflies in the CSS) so it never affects page height or
    // causes scrolling.
    (function () {
      const field = document.getElementById('fireflies');
      if (!field || typeof ARCHIVE_COLLECTIONS === 'undefined') return;
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function rand(min, max) { return Math.random() * (max - min) + min; }
      function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

      // Clustered around the brand mark rather than spread
      // edge-to-edge, so they read as orbiting the hero text.
      // The region is MEASURED off the mark's real rendered box
      // instead of being hardcoded — move the hero (padding,
      // alignment, font size, viewport) and the swarm follows it
      // on its own, with no numbers here to re-tune.
      const hero = document.querySelector('.brandmark');
      const REGION = (() => {
        const fallback = { xMin: 22, xMax: 78, yMin: 20, yMax: 70 };
        if (!hero) return fallback;
        const r = hero.getBoundingClientRect();
        if (!r.width || !r.height) return fallback;
        const cx = ((r.left + r.width / 2) / window.innerWidth) * 100;
        const cy = ((r.top + r.height / 2) / window.innerHeight) * 100;
        // Orbs drift up to ~60px upward from where they're placed,
        // so the band has to start at least that far down or the
        // top row gets clipped off-screen (and becomes unclickable)
        // on shorter viewports. Expressed in px-derived percent so
        // it holds at any window height.
        const topFloor = Math.max(5, (70 / window.innerHeight) * 100);
        return {
          // Wider than the mark itself so they surround it rather
          // than sit in a tight line, and weighted downward since
          // there's little room above once the hero is near the top.
          xMin: clamp(cx - 32, 4, 46),
          xMax: clamp(cx + 32, 54, 96),
          yMin: clamp(cy - 16, topFloor, 45),
          yMax: clamp(cy + 42, 50, 93)
        };
      })();
      const count = ARCHIVE_COLLECTIONS.length;
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / cols);
      const cellW = (REGION.xMax - REGION.xMin) / cols;
      const cellH = (REGION.yMax - REGION.yMin) / rows;

      ARCHIVE_COLLECTIONS.forEach((col, i) => {
        const cellX = REGION.xMin + (i % cols) * cellW + cellW / 2;
        const cellY = REGION.yMin + Math.floor(i / cols) * cellH + cellH / 2;
        const x = clamp(cellX + rand(-cellW * 0.35, cellW * 0.35), REGION.xMin - 3, REGION.xMax + 3);
        const y = clamp(cellY + rand(-cellH * 0.35, cellH * 0.35), REGION.yMin - 3, REGION.yMax + 3);
        const archiveNum = String(i + 1).padStart(4, '0');

        const f = document.createElement('div');
        f.className = 'firefly';
        f.dataset.key = col.key;
        f.tabIndex = 0;
        f.setAttribute('role', 'button');
        f.setAttribute('aria-label', `Open Archive ${archiveNum}`);
        f.style.setProperty('--x', `${x.toFixed(2)}%`);
        f.style.setProperty('--y', `${y.toFixed(2)}%`);

        if (!reduced) {
          f.style.setProperty('--size', `${rand(2.5, 5).toFixed(1)}px`);
          f.style.setProperty('--dx1', `${rand(15, 45).toFixed(0)}px`);
          f.style.setProperty('--dy1', `${rand(-40, -10).toFixed(0)}px`);
          f.style.setProperty('--dx2', `${rand(-30, -10).toFixed(0)}px`);
          f.style.setProperty('--dy2', `${rand(-60, -25).toFixed(0)}px`);
          f.style.setProperty('--dx3', `${rand(-45, -15).toFixed(0)}px`);
          f.style.setProperty('--dy3', `${rand(5, 25).toFixed(0)}px`);
          f.style.setProperty('--dur', `${rand(16, 30).toFixed(1)}s`);
          f.style.setProperty('--delay', `${rand(0, -20).toFixed(1)}s`);
          f.style.setProperty('--blink-dur', `${rand(3, 6.5).toFixed(1)}s`);
          f.style.setProperty('--blink-delay', `${rand(0, -6).toFixed(1)}s`);
          f.style.setProperty('--peak', rand(0.55, 0.9).toFixed(2));
        } else {
          f.style.setProperty('--peak', (0.3 + Math.random() * 0.25).toFixed(2));
        }

        const dot = document.createElement('span');
        dot.className = 'firefly-dot';

        const label = document.createElement('span');
        label.className = 'firefly-label';
        label.textContent = `Archive ${archiveNum}`;

        f.appendChild(dot);
        f.appendChild(label);
        field.appendChild(f);

        f.addEventListener('click', () => openCollection(col.key));
        f.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            openCollection(col.key);
          }
        });
      });
    })();
  </script>
</body>
</html>
